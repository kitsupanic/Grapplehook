[package]
name = "grapplehook"
version = "0.2.2"
description = "Download and transcode videos with yt-dlp and ffmpeg"
license = "MIT"
edition = "2021"
# `File::lock` in the download temp folders.
rust-version = "1.89"

[lib]
name = "grapplehook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sha2 = "0.11.1"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
tar = { version = "0.4.46", default-features = false }
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
arboard = { version = "3", default-features = false }
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"
