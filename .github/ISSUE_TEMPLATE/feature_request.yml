name: Feature request
description: Suggest something Grapplehook should do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the task, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working in the app.
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
